<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` is load-bearing: on iOS's default `resizes-visual` the
      keyboard changes neither the layout viewport nor `dvh`, so a bottom sheet stays full height
      with Save under ~340px of keyboard. `.sheet__foot` is also sticky, for engines ignoring this.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="color-scheme" content="light" />
    <!--
      Inline, so it costs no request, and without one every load logs a 404 for /favicon.ico. The
      two-rings mark on the accent, and the one copy of it that cannot be derived —
      `scripts/make-icons.js` rasterises it for the Home Screen, `RingsIcon` draws it in the app,
      and the three must not drift. Same 24-unit box as `RingsIcon`, so the geometry is literally
      the same numbers. Covered by `img-src 'self' data:`.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.25' fill='%231c4b74'/%3E%3Cg fill='none' stroke='white' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='9' cy='14' r='6'/%3E%3Ccircle cx='15' cy='14' r='6'/%3E%3Cpath d='M15 4.5 12 8l-3-3.5 1.6-1.5h2.8Z'/%3E%3C/g%3E%3C/svg%3E"
    />
    <!--
      Home Screen install (iOS Safari 26+): Share -> Add to Home Screen. scripts/build-sw.js
      generates the service worker into dist/ and main.jsx registers it in production only; it is
      what makes a cold launch do no network work, since Pages serves even content-hashed assets
      with max-age=600. iOS uses `apple-touch-icon`, not the SVG favicon, for the tile and splash;
      those PNGs live in `public/`.

      `public/manifest.webmanifest` has no `start_url`, so it defaults to the document URL: an
      editor installs from a URL still carrying `#k=…`, and the installed app — its own storage
      bucket, separate from Safari's — captures the key on first launch (`src/lib/access.js`).

      Absolute paths, like the script tag below: Vite's dev server prepends `base` to a
      leading-slash href once, and %BASE_URL% already resolves to the base, so it would double.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- The hero photograph is the largest-contentful-paint element and React renders it, so the
         preload scanner cannot see it: without this the request waits for the bundle to download,
         parse and commit a first render. `fetchpriority="high"` is the other half — an `as="image"`
         preload is queued at low priority and would wait behind that same bundle. Same origin, so
         `img-src 'self'` covers it. -->
    <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />
    <!-- Safari recognizes only the apple- prefixed tag; the unprefixed one is the
         standards-track name Chromium asks for. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `black-translucent`, and it is what makes the header reach the top of the screen. With
      `default`, iOS owns the status-bar strip in an installed app: it draws its own backdrop over
      the scrolling document there, so the list showed through above the photograph and no amount of
      `position: fixed` could cover it — the strip is not the web view's to paint. `black-translucent`
      hands the strip to the page, `env(safe-area-inset-top)` then reports the inset, and
      `--hero-photo`'s band already composes it, so the photograph fills it.

      The glyphs turn white as a result. `--photo-scrim-top` is what keeps them legible over a bright
      sky; a crop whose top strip is dark is still the thing to avoid, for the picture's sake rather
      than the clock's.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wedding" />
    <!--
      An allowlist. `script-src 'self'` is possible because no third-party JavaScript runs here:
      no Google Identity Services, no Picker iframe, no Sheets client library. Nothing signs in —
      the Sheets API takes a plain `fetch` with a token the Apps Script endpoint minted — so no
      sign-in host may be added; `accounts.google.com` here would mean the capability link had
      been replaced with OAuth.

      `sheets.googleapis.com` is the one host carrying a credential: an editor mints from `/exec`
      at 1.0-1.6s a request, then reads and writes directly at ~0.24s. A view-only visitor holds
      no token and never reaches it, their board coming from `doGet`. Removing this host does not
      make the app safer, it makes every write four times slower.

      `script.googleusercontent.com` is not redundant: `/exec` answers with a 302 to it. Current
      Chrome does not re-check `connect-src` against a redirect target, but browsers have differed
      and Safari is the primary target.

      This tag does not cover the service worker's own context: a worker's CSP comes from the
      headers served with its script, and Pages sends none. Hence the worker never intercepts a
      cross-origin request — it must not be an uncovered proxy in front of these hosts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        frame-src 'none';
        connect-src 'self' https://script.google.com https://script.googleusercontent.com
          https://sheets.googleapis.com;
        img-src 'self' data:;
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        base-uri 'none';
        form-action 'none';
        object-src 'none';
      "
    />
    <title>Wedding</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
