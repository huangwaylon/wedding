<!doctype html>
<!--
  The screenshot harness. One page; everything is driven by the query string.

    harness.html?f=en-home&w=390,430,768
    harness.html?f=en&w=1440&h=930
    harness.html?f=en&w=393&to=.tcard--open            scrolled to the opened card
    harness.html?f=en-home,en-sage,en-gold&w=330&h=480

  f       comma-separated preview files. The `preview-` prefix and `.html` are optional.
  w       comma-separated iframe widths in px, applied to every file
  h       iframe height in px (default 900)
  to      a CSS selector to scroll the frame's document to, centred

  Iframes, not a resized window: each frame gets its own viewport, so container and media queries
  resolve correctly, while headless Chrome reports a different width than asked for. `to` does not
  survive a headless capture either, so a surface only reachable mid-scroll needs a preview page of
  its own. Everything scrolls with the document — no surface owns a nested scroller — so `to` is
  the only positioning control here.

  Regenerate the preview files first: `npx vite-node scripts/preview.jsx`.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        background: #333;
        font: 11px system-ui, sans-serif;
        color: #fff;
      }
      .row {
        display: flex;
        gap: 10px;
        padding: 10px;
        align-items: flex-start;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      iframe {
        border: 0;
        background: #faf8f3;
      }
    </style>
  </head>
  <body>
    <div class="row" id="row"></div>
    <script>
      const params = new URLSearchParams(location.search)
      const files = (params.get('f') || 'en')
        .split(',')
        .map((name) => name.trim())
        .filter(Boolean)
        .map((name) => {
          const prefixed = name.startsWith('preview-') ? name : `preview-${name}`
          return prefixed.endsWith('.html') ? prefixed : `${prefixed}.html`
        })
      const widths = (params.get('w') || '390,430,768').split(',').map(Number)
      const height = Number(params.get('h') || 900)
      /** A CSS selector to scroll the iframe's own document to. */
      const to = params.get('to') || ''
      const row = document.getElementById('row')

      for (const file of files) {
        for (const width of widths) {
          const col = document.createElement('div')
          col.className = 'col'
          const label = document.createElement('span')
          label.textContent = `${file.replace(/^preview-/, '').replace(/\.html$/, '')} @ ${width}`
          col.appendChild(label)

          const frame = document.createElement('iframe')
          frame.src = file
          frame.width = width
          frame.height = height
          frame.onload = () => {
            const doc = frame.contentDocument
            if (to) doc?.querySelector(to)?.scrollIntoView({ block: 'center' })
          }
          col.appendChild(frame)
          row.appendChild(col)
        }
      }
    </script>
  </body>
</html>
