<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#333;font:11px system-ui;color:#fff}
.row{display:flex;gap:8px;padding:8px}.col{display:flex;flex-direction:column;gap:3px}
iframe{border:0}
</style></head><body><div class="row" id="r"></div><script>
const files=['preview-en.html','preview-en-sage.html','preview-en-indigo.html','preview-en-plum.html','preview-en-gold.html']
const r=document.getElementById('r')
for(const f of files){const c=document.createElement('div');c.className='col';c.innerHTML='<span>'+f.replace('preview-en','').replace('.html','')||'rose'+'</span>';
const i=document.createElement('iframe');i.src=f;i.width=330;i.height=470;c.appendChild(i);r.appendChild(c)}
</script></body></html>
